name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Habilita logs coloridos nas ferramentas que respeitam FORCE_COLOR.
  FORCE_COLOR: '3'

jobs:
  # ----------------------------------------------------------------
  # Qualidade: lint + formatação + tipos + build (roda em PR e push)
  # ----------------------------------------------------------------
  quality:
    name: Qualidade & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Instalar dependências (Yarn)
        run: |
          printf '\033[1;34m==> Habilitando corepack/yarn\033[0m\n'
          corepack enable
          printf '\033[1;34m==> yarn install --immutable\033[0m\n'
          yarn install --immutable

      - name: 🎨 Prettier (verificação de formatação)
        run: |
          echo "::group::prettier --check src/"
          yarn format:check
          echo "::endgroup::"

      - name: 🔎 ESLint
        run: |
          echo "::group::eslint ."
          yarn lint:check
          echo "::endgroup::"

      - name: 🧪 Type-check (vue-tsc)
        run: |
          echo "::group::vue-tsc --build"
          yarn type-check
          echo "::endgroup::"

      - name: 🏗️ Build de produção
        run: |
          echo "::group::vite build"
          yarn build-only
          echo "::endgroup::"
          printf '\033[1;32m==> Build concluído\033[0m\n'

      - name: ⬆️ Publicar artefato (dist)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Deploy: envia o dist/ para o servidor via SSH (somente push main)
  # ----------------------------------------------------------------
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: 📥 Checkout (para a config do nginx)
        uses: actions/checkout@v4

      - name: ⬇️ Baixar artefato (dist)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 🔐 Configurar chave SSH
        run: |
          printf '\033[1;34m==> Preparando credenciais SSH\033[0m\n'
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}

      - name: 🚀 Publicar e recarregar nginx
        run: bash deploy/deploy.sh
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

      - name: 🧹 Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
