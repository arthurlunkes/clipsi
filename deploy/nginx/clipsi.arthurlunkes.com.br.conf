# =============================================================
#  Clínica Psi — SPA estática (Vue 3 + Vite)
#  Domínio: clipsi.arthurlunkes.com.br
#  Raiz servida: deve corresponder a DEPLOY_PATH do workflow
#  (padrão: /var/www/clipsi)
# =============================================================

# Redireciona HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name clipsi.arthurlunkes.com.br;

    # Desafio do Let's Encrypt (renovação de certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clipsi.arthurlunkes.com.br;

    root /var/www/clipsi;
    index index.html;

    # ---- TLS (gerenciado pelo certbot) ----
    ssl_certificate     /etc/letsencrypt/live/clipsi.arthurlunkes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clipsi.arthurlunkes.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # ---- Cabeçalhos de segurança ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Compressão ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json
        font/woff2;

    # ---- Assets com hash no nome: cache longo e imutável ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Demais arquivos estáticos ----
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- SPA fallback: toda rota desconhecida volta ao index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca deve ser cacheado (garante deploy sem stale)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Bloqueia acesso a arquivos ocultos (ex.: .env, .git)
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/clipsi.access.log;
    error_log  /var/log/nginx/clipsi.error.log;
}
